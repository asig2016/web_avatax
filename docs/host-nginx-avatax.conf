# Template for variant B of docs/DEPLOY.md: nginx installed directly on the
# Hetzner host terminates TLS and proxies to the "web" container on 127.0.0.1:8090.
#
# Copy to /etc/nginx/sites-available/avatax.eu (Debian/Ubuntu) or
# /etc/nginx/conf.d/avatax.eu.conf (RHEL-like), adjust, then:
#   nginx -t && systemctl reload nginx
# Certificates: certbot --nginx -d avatax.eu -d www.avatax.eu

server {
    listen 80;
    listen [::]:80;
    server_name avatax.eu www.avatax.eu;
    # certbot's HTTP-01 challenge is handled automatically with --nginx
    location / { return 301 https://avatax.eu$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.avatax.eu;
    ssl_certificate     /etc/letsencrypt/live/avatax.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avatax.eu/privkey.pem;
    return 301 https://avatax.eu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avatax.eu;

    ssl_certificate     /etc/letsencrypt/live/avatax.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avatax.eu/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CV uploads are limited to 5 MB by formsvc; allow a little overhead.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
