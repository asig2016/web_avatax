# nginx inside the "web" container.
# TLS is terminated by the existing reverse proxy on the Hetzner host; this
# server only speaks plain HTTP on the internal port 80.

# Needed for the long URLs in the redirect map (redirects.conf); must precede all maps.
map_hash_bucket_size 256;

# Trust X-Forwarded-For from the reverse proxy (Docker/private networks and localhost).
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep http:// vs https:// from the outer proxy for absolute redirects.
map $http_x_forwarded_proto $fwd_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Repeated in every location that sets its own add_header (nginx does not inherit them).
    include /etc/nginx/conf.d/security-headers.inc;

    # 301s from the old Drupal URLs (map in redirects.conf)
    if ($redirect_to) {
        return 301 $redirect_to;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Form service
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://formsvc:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_scheme;
        proxy_read_timeout 60s;
    }

    # Fingerprinted assets (Hugo adds a content hash) can be cached forever.
    location ~* "^/(css|js)/.+\.[0-9a-f]{16,}\.(css|js)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location /files/ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 10m;
    }

    # Localized 404 pages generated by Hugo
    location ^~ /de/ {
        error_page 404 /de/404.html;
        try_files $uri $uri/ =404;
        expires 10m;
    }
    location ^~ /el/ {
        error_page 404 /el/404.html;
        try_files $uri $uri/ =404;
        expires 10m;
    }
    error_page 404 /404.html;
}
