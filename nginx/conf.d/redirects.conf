# 301 redirects from the old Drupal 7 site of avatax.eu (keeps search rankings and old links).
# Used by default.conf:  if ($redirect_to) { return 301 $redirect_to; }
# (map_hash_bucket_size is set in default.conf, which is included first.)

map $uri $redirect_to {
    # careers hidden on DE/EN – send visitors to the Greek careers page
    /careers                                            /el/karriera/;
    /careers/                                           /el/karriera/;
    /careers/apply/                                     /el/karriera/aitisi/;
    /de/karriere                                        /el/karriera/;
    /de/karriere/                                       /el/karriera/;
    /de/karriere/bewerbung/                             /el/karriera/aitisi/;
    default "";

    # --- English (was at /) ---
    /content/contact                                    /contact/;
    /career                                             /el/karriera/;
    /node/137                                           /el/karriera/logistis-a-taxeos/;
    /node/140                                           /el/karriera/voithos-logisti/;
    ~^/tags/                                            /el/karriera/;
    ~^/en/?$                                            /;

    # --- German ---
    /de/steuerberatung                                  /de/leistungen/steuerberatung/;
    /de/buchhaltung-und-jahresabschluss                 /de/leistungen/buchhaltung-und-jahresabschluss/;
    /de/ihr-start-griechenland                          /de/leistungen/ihr-start-in-griechenland/;
    /de/uber-uns                                        /de/ueber-uns/;
    /de/content/kontakt                                 /de/kontakt/;
    /de/career                                          /el/karriera/;
    /de/node/137                                        /el/karriera/logistis-a-taxeos/;
    /de/node/140                                        /el/karriera/voithos-logisti/;
    ~^/de/tags/                                         /el/karriera/;

    # --- Greek ---
    /el/liga-logia-gia-emas                             /el/etaireia/;
    /el/content/epikoinonia                             /el/epikoinonia/;
    /el/career                                          /el/karriera/;
    /el/content/senaccountant                           /el/karriera/logistis-a-taxeos/;
    /el/content/voithos-logisti                         /el/karriera/voithos-logisti/;
    /el/content/ypovoli-viografikoy                     /el/karriera/aitisi/;
    ~^/el/tags/                                         /el/karriera/;

    # --- Industries page: not offered (owner decision) ---
    ~^/de/branchen/?$                                   /de/ueber-uns/;
    ~^/el/kladoi/?$                                     /el/etaireia/;

    # --- Files ---
    /sites/default/files/g3052.png                      /images/logo.png;
}
